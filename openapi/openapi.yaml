openapi: 3.0.3
info:
  title: courier-outbox
  version: 0.4.0
  description: |
    Reliable outbound webhook delivery service.

    This document lists the endpoints that exist today. Each feature change
    must update it in the same PR as the handler (see
    docs/architecture/patterns-layering.md). The planned surface is in
    SRS §4.2 and openspec/specs/.

    Every path under `/v1` requires `Authorization: Bearer <api_key>`.
    Subscription CRUD, event enqueue, delivery list/detail, and DLQ replay
    are implemented.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
security: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [ops]
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Pings Postgres and Redis. Returns 200 when both answer, otherwise
        503 with `code` = `unavailable` naming the failing dependencies.
        Driver errors are never included in the response.
      tags: [ops]
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        "503":
          description: One or more dependencies did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unavailable
                message: "not ready: redis"
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      description: Returns subscriptions owned by the authenticated API key. Signing secrets are never included.
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's subscriptions, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSubscription
      summary: Create a subscription
      description: |
        Registers a webhook endpoint. The signing secret is returned once
        as standard base64 of 32 random bytes and is stored encrypted.
      tags: [subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created. Copy `signing_secret` now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionWithSecret"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      operationId: getSubscription
      summary: Get a subscription
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The subscription. `signing_secret` is omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSubscription
      summary: Update a subscription
      description: |
        Partial update. `rotate_secret=true` issues a new signing secret
        and returns it once. A foreign or missing id is 404.
      tags: [subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription. `signing_secret` is present only after rotate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionWithSecret"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/subscriptions/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      operationId: disableSubscription
      summary: Disable a subscription
      description: Sets `enabled` to false. Idempotent. The row remains readable.
      tags: [subscriptions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The disabled subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/events:
    post:
      operationId: enqueueEvent
      summary: Enqueue an event
      description: |
        Persists the event and one pending delivery per matching enabled
        subscription in a single transaction. Reusing `idempotency_key`
        for the same API key returns 200 with `Idempotent-Replay: true`
        and the original ids. Request bodies larger than 256 KiB are 413.
      tags: [events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueEventRequest"
      responses:
        "201":
          description: Event created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueEventResponse"
        "200":
          description: Idempotent replay of an existing event.
          headers:
            Idempotent-Replay:
              required: true
              schema:
                type: string
                enum: ["true"]
              description: Always `true` on a replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueEventResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      summary: Get an event
      description: |
        Returns event metadata, payload, and delivery summaries for the
        calling API key. A foreign or missing id is 404.
      tags: [events]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The event owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deliveries:
    get:
      operationId: listDeliveries
      summary: List deliveries
      description: |
        Returns deliveries owned by the authenticated API key. Filter with
        `status` (including `dead_lettered`), `subscription_id`, event `type`,
        `created_after`, and `created_before`. Paginate with `limit` (default
        50, max 100) and `offset`. Signing secrets and event payloads are
        never included.
      tags: [deliveries]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Event type of the parent event.
          schema:
            type: string
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on delivery `created_at` (RFC 3339).
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound on delivery `created_at` (RFC 3339).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryList"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/deliveries/{id}:
    parameters:
      - $ref: "#/components/parameters/DeliveryId"
    get:
      operationId: getDelivery
      summary: Get a delivery and its attempt history
      description: |
        Returns the delivery owned by the calling API key and its append-only
        attempts oldest to newest. A foreign or missing id is 404. The event
        payload and signing secret are omitted.
      tags: [deliveries]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The delivery and its attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deliveries/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/DeliveryId"
    post:
      operationId: replayDelivery
      summary: Replay a dead-lettered delivery
      description: |
        Allowed only when the delivery is `dead_lettered`. Sets status to
        `pending`, `next_attempt_at` to now, and clears the lease. Does not
        reset `attempt_count` or delete attempt rows. Other statuses are 409
        `invalid_transition`.
      tags: [deliveries]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Delivery reset to pending for the worker to claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Producer API key printed once by `courier keys create --name <name>`.
        Format `co_<prefix>_<secret>`. Send as `Authorization: Bearer <key>`.
  parameters:
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Subscription id. Malformed values return 400, not 404.
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Event id. Malformed values return 400, not 404.
    DeliveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Delivery id. Malformed values return 400, not 404.
  responses:
    Unauthorized:
      description: |
        Missing, malformed, unknown, wrong, or revoked API key. All five
        cases share this status, body, and `WWW-Authenticate` header.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: 'Bearer realm="courier"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: missing or invalid api key
    NotFound:
      description: Resource does not exist or is owned by another API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: resource not found
    ValidationFailed:
      description: Malformed JSON, unknown field, or domain validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: "target_url: must use https"
    PayloadTooLarge:
      description: Request body exceeded 256 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: payload_too_large
            message: request body too large
    InvalidTransition:
      description: The delivery is not in a state that allows this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_transition
            message: delivery is not dead_lettered
  schemas:
    Error:
      type: object
      description: Error envelope returned by every non-2xx response.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable snake_case identifier.
          example: not_found
        message:
          type: string
          description: Human-readable, safe to display. Never contains secrets.
          example: resource not found
    Subscription:
      type: object
      required: [id, target_url, event_types, headers, enabled, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        target_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SubscriptionWithSecret:
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          properties:
            signing_secret:
              type: string
              description: Standard base64 of 32 random bytes. Present only on create and rotate.
    SubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
    CreateSubscriptionRequest:
      type: object
      required: [target_url]
      properties:
        target_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
          default: ["*"]
        headers:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
    PatchSubscriptionRequest:
      type: object
      additionalProperties: false
      properties:
        target_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        description:
          type: string
        enabled:
          type: boolean
        rotate_secret:
          type: boolean
    EnqueueEventRequest:
      type: object
      additionalProperties: false
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9]+([._-][a-z0-9]+)*$'
        payload:
          type: object
          additionalProperties: true
          description: JSON object. The whole request body must be at most 256 KiB.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339. Defaults to the server time when omitted.
    EnqueueEventResponse:
      type: object
      required: [event_id, delivery_ids]
      properties:
        event_id:
          type: string
          format: uuid
        delivery_ids:
          type: array
          items:
            type: string
            format: uuid
    Event:
      type: object
      required: [id, type, payload, idempotency_key, occurred_at, created_at, deliveries]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/DeliverySummary"
    DeliverySummary:
      type: object
      required: [id, subscription_id, status, attempt_count, next_attempt_at]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
    DeliveryStatus:
      type: string
      enum: [pending, retrying, delivered, dead_lettered]
    Delivery:
      type: object
      required: [id, event_id, subscription_id, event_type, status, attempt_count, next_attempt_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeliveryAttempt:
      type: object
      required: [duration_ms, request_id, created_at]
      properties:
        status_code:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        duration_ms:
          type: integer
          minimum: 0
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
    DeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/Delivery"
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryAttempt"
    DeliveryList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
